# Cuts a release: test -> bump -> commit -> tag -> push -> GitHub release ->
# hand over to publish.yml.
#
# Dispatched by hand with a version rather than triggered by a tag. GitHub does
# not start new workflow runs from events created with the default
# GITHUB_TOKEN, so `on: push: tags` never fires for a tag a workflow pushed.
#
# pub.dev only accepts a publish from a run whose ref is a tag, so publishing
# cannot happen in this run (it is on a branch). workflow_dispatch is the one
# event GITHUB_TOKEN is allowed to start, so the last step dispatches
# publish.yml against the new tag. That is why this job needs actions: write.
#
# The GitHub release is the guaranteed outcome; publishing is best-effort and
# is skipped, with a warning, unless the repository variable PUB_PUBLISH is
# "true".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write
  actions: write # to dispatch publish.yml on the new tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - name: Resolve, analyse and test
        run: |
          set -eu
          dart pub get
          dart analyze --fatal-infos
          (cd packages/activeledger && dart test)

      - name: Bump both package versions
        run: |
          set -eu
          v="${{ inputs.version }}"
          for pkg in activeledger activeledger_falcon; do
            sed -i "0,/^version: .*/s//version: $v/" "packages/$pkg/pubspec.yaml"
            grep -q "^version: $v$" "packages/$pkg/pubspec.yaml" || { echo "bump did not take for $pkg"; exit 1; }
          done

      - name: Commit, tag and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A first release at the version already in the manifests is a no-op
          # commit; tag it anyway.
          git diff --quiet || git commit -am "chore(release): v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes

      - name: Publish from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh workflow run publish.yml --ref "v${{ inputs.version }}"
