name: activeledger
description: >-
  Activeledger SDK for Dart and Flutter. Onboard identities, sign and submit
  transactions, and subscribe to ledger events with secp256k1 and
  post-quantum ML-DSA-65 keys.
version: 1.0.0
homepage: https://github.com/activeledger/SDK-Dart
repository: https://github.com/activeledger/SDK-Dart/tree/master/packages/activeledger
issue_tracker: https://github.com/activeledger/SDK-Dart/issues
topics:
  - activeledger
  - blockchain
  - dlt
  - post-quantum
  - cryptography

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  http: ^1.2.0
  pointycastle: ^4.0.0
  pqcrypto: ^0.4.2
  unorm_dart: ^0.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Throwaway test keys, generated for the RSA / PEM compatibility tests.
false_secrets:
  - /test/fixtures/pem-keys.json
