  Falcon-512 (FN-DSA) post-quantum keys for the Activeledger Dart SDK, backed
  by liboqs with prebuilt native libraries.
version: 1.0.0
homepage: https://github.com/activeledger/SDK-Dart
repository: https://github.com/activeledger/SDK-Dart/tree/master/packages/activeledger_falcon
